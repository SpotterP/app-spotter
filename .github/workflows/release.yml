# Pushing a tag such as v1.0.0 builds the app and leaves a DRAFT release with the
# Android APK and the unsigned iOS build. Nothing is published by this workflow:
# the draft waits for a human.
name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v7
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # A tag with red tests must not produce a release half done.
      - run: flutter test

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: iOS build (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # The repo declares no DEVELOPMENT_TEAM and has no certificates, so signing
      # is impossible here. Flutter writes the Podfile itself and uses the
      # CocoaPods the macOS runner ships.
      - run: flutter build ios --release --no-codesign

      # A folder with Runner.app inside Payload/ is what an .ipa is.
      - run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry app.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: app.ipa
          if-no-files-found: error

  release:
    name: Draft release
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          mv app-release.apk "app-spotter-$TAG-android.apk"
          mv app.ipa "app-spotter-$TAG-ios-unsigned.ipa"
          gh release create "$TAG" --draft --title "$TAG" --generate-notes \
            "app-spotter-$TAG-android.apk" "app-spotter-$TAG-ios-unsigned.ipa"
