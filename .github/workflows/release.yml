# Pushing a tag such as v1.0.0 builds the app and leaves a DRAFT release with the
# Android APK and the unsigned iOS build. Nothing is published by this workflow:
# the draft waits for a human.
name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # A tag with red tests must not produce a release half done.
      - run: flutter test

      # A release built without the API URL would point at 10.0.2.2, the emulator.
      - name: Build the APK against the production API
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Falta la variable del repo API_URL, por ejemplo https://api.tudominio.com. Se crea en Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          flutter build apk --release --dart-define=API_URL="$API_URL"

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: iOS build (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # The repo declares no DEVELOPMENT_TEAM and has no certificates, so signing
      # is impossible here. Flutter writes the Podfile itself and uses the
      # CocoaPods the macOS runner ships.
      - name: Build iOS against the production API, unsigned
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Falta la variable del repo API_URL, por ejemplo https://api.tudominio.com. Se crea en Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          flutter build ios --release --no-codesign --dart-define=API_URL="$API_URL"

      # A folder with Runner.app inside Payload/ is what an .ipa is.
      - run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry app.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: app.ipa
          if-no-files-found: error
    
  ios-simulator:
    name: iOS simulator build (Appetize)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build ios --simulator --debug --dart-define=API_URL="${{ vars.API_URL }}"
      - run: cd build/ios/iphonesimulator && zip -qry ../../../app-simulator.zip Runner.app
      - uses: actions/upload-artifact@v7
        with:
          name: ios-simulator
          path: app-simulator.zip

  release:
    name: Draft release
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          # --repo: este job no hace checkout, así que gh no tiene un repositorio git del cual
          # deducir dónde publicar. Se lo decimos explícito en vez de bajar el código solo para eso.
          REPO: ${{ github.repository }}
        run: |
          cd dist
          mv app-release.apk "app-spotter-$TAG-android.apk"
          mv app.ipa "app-spotter-$TAG-ios-unsigned.ipa"
          gh release create "$TAG" --repo "$REPO" --draft --title "$TAG" --generate-notes \
            "app-spotter-$TAG-android.apk" "app-spotter-$TAG-ios-unsigned.ipa"
